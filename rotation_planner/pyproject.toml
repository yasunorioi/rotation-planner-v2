[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotation-planner"
version = "1.0.0"
description = "北海道畑作農家向け農業管理アプリケーション"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Rotation Planner Team"}
]
keywords = ["agriculture", "crop-rotation", "farm-management", "gradio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.10"

dependencies = [
    "gradio>=4.0.0",
    "pandas>=2.0.0",
    "ortools>=9.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/example/rotation-planner"
Documentation = "https://github.com/example/rotation-planner#readme"
Repository = "https://github.com/example/rotation-planner"

[project.scripts]
rotation-planner = "rotation_planner.portal:main"

[project.gui-scripts]
rotation-planner-gui = "rotation_planner.portal:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rotation_planner*"]

[tool.setuptools.package-data]
rotation_planner = [
    "data/*.json",
    "data/*.csv",
    "data/*.db",
    "templates/*.csv",
]

# =============================================================================
# Development Tools Configuration
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["rotation_planner"]
skip = [".venv", "__pycache__"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=rotation_planner --cov-report=term-missing"
