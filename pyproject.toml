[project]
name = "rotation-planner-v2"
version = "0.1.0"
description = "輪作計画アプリ v2 — HTMX + FastAPI + Jinja2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pandas>=2.0.0",
    "ortools>=9.0",
    "shapely>=2.0.0",
    "pyproj>=3.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["rotation_planner*", "app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
