{% extends "base.html" %}
{% block title %}ほ場一覧{% endblock %}
{% block content %}
<h2>ほ場一覧</h2>
<table id="fields-table">
  <thead>
    <tr>
      <th>圃場コード</th><th>地区</th><th>名称</th><th>面積(ha)</th><th>てんさい禁忌</th><th>備考</th><th></th>
    </tr>
  </thead>
  <tbody>
    {% for field in fields %}
      {% include "fields/_row.html" %}
    {% endfor %}
  </tbody>
</table>

<div id="field-form-slot">
  <button hx-get="/fields/new" hx-target="#field-form-slot" hx-swap="innerHTML">＋ 新規追加</button>
</div>
{% endblock %}
