{% extends "base.html" %}
{% block title %}ほ場一覧{% endblock %}
{% block content %}
<h2>ほ場一覧</h2>
<table id="fields-table">
  <thead>
    <tr>
      <th>圃場コード</th><th>地区</th><th>名称</th><th>面積(ha)</th><th>てんさい禁忌</th><th>図</th><th>備考</th><th></th>
    </tr>
  </thead>
  <tbody>
    {% for field in fields %}
      {% include "fields/_row.html" %}
    {% endfor %}
  </tbody>
</table>

<div id="field-form-slot">
  <button hx-get="/fields/new" hx-target="#field-form-slot" hx-swap="innerHTML">＋ 新規追加</button>
</div>

<div class="import-block">
  <h3>CSV 取込/出力
    <small>
      <a href="/fields/template.csv">テンプレート</a> |
      <a href="/fields/export.csv">エクスポート</a>
    </small>
  </h3>
  <form hx-post="/fields/import" hx-encoding="multipart/form-data"
        hx-target="#import-result" hx-swap="innerHTML">
    <input type="file" name="file" accept=".csv" required>
    <button type="submit">取込</button>
  </form>
  <div id="import-result"></div>
</div>
{% endblock %}
