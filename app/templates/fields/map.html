{% extends "base.html" %}
{% block title %}ほ場マップ{% endblock %}
{% block content %}
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<h2>ほ場マップ</h2>
<p>
  <a href="/fields/">← ほ場一覧</a> |
  <a href="/fields/polygons.geojson">GeoJSON ダウンロード</a>
</p>

<div id="map" class="field-map"></div>

<script>
(function () {
  const map = L.map('map').setView([43.0642, 141.3469], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  }).addTo(map);

  fetch('/fields/polygons.geojson', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(fc => {
      if (!fc.features || fc.features.length === 0) {
        document.getElementById('map').insertAdjacentHTML(
          'beforebegin',
          '<p class="hint">ポリゴン登録済みのほ場がありません。<a href="/fields/">ほ場一覧</a> から地図を編集してください。</p>'
        );
        return;
      }
      const layer = L.geoJSON(fc, {
        style: { color: '#2d6a4f', weight: 2, fillOpacity: 0.25 },
        onEachFeature: (feat, lyr) => {
          const p = feat.properties || {};
          lyr.bindPopup(
            `<strong>${p.field_code || ''}</strong> ${p.name || ''}<br>` +
            `地区: ${p.district || '—'}<br>` +
            `面積: ${(p.area_ha || 0).toFixed(2)} ha<br>` +
            `<a href="/fields/${p.id}/polygon">ポリゴン編集</a>`
          );
        },
      }).addTo(map);
      map.fitBounds(layer.getBounds(), { maxZoom: 16 });
    });
})();
</script>
{% endblock %}
