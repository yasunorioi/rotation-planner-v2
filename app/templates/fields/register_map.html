{% extends "base.html" %}
{% block title %}地図から圃場を登録{% endblock %}
{% block content %}
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<h2>地図から圃場を登録</h2>
<p class="register-help">
  地図をズーム14以上に拡大 →「筆ポリゴン表示」ON → 筆をクリック → 右のフォームで作成。
  ポリゴンと面積は自動で入ります。続けて次の筆をクリックできます。
</p>

<div class="polygon-toolbar">
  <label class="fude-toggle-label">
    <input type="checkbox" id="fude-toggle" checked> 筆ポリゴン表示
  </label>
  <a href="/fields/" class="cancel-link">ほ場一覧へ</a>
</div>
<p id="fude-info" class="fude-info"></p>

<div class="register-map-wrap">
  <div id="map" class="field-map"></div>
  <aside id="register-panel" class="register-panel">
    <h3>この筆を登録</h3>
    <label>ほ場コード <span class="req">*</span>
      <input id="f-code" type="text" placeholder="例: A-1">
    </label>
    <label>ほ場名
      <input id="f-name" type="text" placeholder="(任意)">
    </label>
    <label>地区
      <input id="f-district" type="text" list="reg-districts" placeholder="(任意)">
      <datalist id="reg-districts">
        {% for d in districts %}<option value="{{ d }}"></option>{% endfor %}
      </datalist>
    </label>
    <label>面積 (ha)
      <input id="f-area" type="number" step="0.01" min="0">
    </label>
    <button id="create-btn" type="button" class="primary-action">このほ場を作成</button>
    <p id="form-msg" class="form-msg"></p>
    <h4>このセッションで登録した筆</h4>
    <ul id="created-list" class="created-list"></ul>
  </aside>
</div>

<script id="register-map-data" type="application/json">{{ map_data|tojson }}</script>
<script src="/static/js/register_map.js"></script>
{% endblock %}
