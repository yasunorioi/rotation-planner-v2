{% if field %}
<form hx-put="/fields/{{ field.id }}"
      hx-target="#field-{{ field.id }}" hx-swap="outerHTML"
      hx-on::after-request="this.closest('#field-form-slot').innerHTML = '<button hx-get=&quot;/fields/new&quot; hx-target=&quot;#field-form-slot&quot; hx-swap=&quot;innerHTML&quot;>＋ 新規追加</button>'; htmx.process(this.closest('#field-form-slot'))">
{% else %}
<form hx-post="/fields/"
      hx-target="#fields-table tbody" hx-swap="beforeend"
      hx-on::after-request="this.reset()">
{% endif %}
  <label>圃場コード <input name="field_code" required value="{{ field.field_code if field else '' }}"></label>
  <label>地区 <input name="district" value="{{ field.district if field and field.district else '' }}"></label>
  <label>名称 <input name="name" value="{{ field.name if field and field.name else '' }}"></label>
  <label>面積(ha) <input name="area_ha" type="number" step="0.01" required value="{{ field.area_ha if field else '' }}"></label>
  <label><input name="beet_forbidden" type="checkbox" {% if field and field.beet_forbidden %}checked{% endif %}> てんさい禁忌</label>
  <label>備考 <input name="notes" value="{{ field.notes if field and field.notes else '' }}"></label>
  <button type="submit">{{ "更新" if field else "追加" }}</button>
  <button type="button"
          hx-get="/fields/" hx-target="#field-form-slot" hx-select="#field-form-slot"
          hx-swap="outerHTML">キャンセル</button>
</form>
