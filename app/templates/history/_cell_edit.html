<td class="history-cell editing">
  <form hx-post="/history/cell" hx-target="closest td" hx-swap="outerHTML">
    <input type="hidden" name="field_id" value="{{ field_id }}">
    <input type="hidden" name="year" value="{{ year }}">
    <input type="text" name="crop" value="{{ crop }}" autofocus
           hx-get="/history/cell?field_id={{ field_id }}&year={{ year }}"
           hx-trigger="keyup[key=='Escape']"
           hx-target="closest td" hx-swap="outerHTML">
  </form>
</td>
