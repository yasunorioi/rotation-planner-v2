{% extends "base.html" %}
{% block title %}防除記録{% endblock %}
{% block content %}
<h2>防除記録</h2>

<div class="import-block">
  <h3>CSV 取込/出力
    <small>
      <a href="/pesticide-records/template.csv">テンプレート</a> |
      <a href="/pesticide-records/export.csv">エクスポート</a>
    </small>
  </h3>
  <form hx-post="/pesticide-records/import" hx-encoding="multipart/form-data"
        hx-target="#pr-import-result" hx-swap="innerHTML">
    <input type="file" name="file" accept=".csv" required>
    <button type="submit">取込</button>
  </form>
  <div id="pr-import-result"></div>
</div>

<table id="records-table">
  <thead>
    <tr>
      <th>散布日</th><th>ほ場</th><th>農薬名</th><th>希釈倍率</th><th>量</th><th>単位</th><th>備考</th><th></th>
    </tr>
  </thead>
  <tbody>
    {% for record in records %}
      {% include "pesticide_records/_row.html" %}
    {% endfor %}
  </tbody>
</table>

<div id="record-form-slot">
  {% if not fields %}
    <p class="hint">先に <a href="/fields/">ほ場</a> を登録してください。</p>
  {% else %}
    <button hx-get="/pesticide-records/new" hx-target="#record-form-slot" hx-swap="innerHTML">＋ 新規追加</button>
  {% endif %}
</div>
{% endblock %}
