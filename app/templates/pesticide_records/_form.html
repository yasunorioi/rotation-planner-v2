{% if record %}
<form hx-put="/pesticide-records/{{ record.id }}"
      hx-target="#record-{{ record.id }}" hx-swap="outerHTML"
      hx-on::after-request="this.closest('#record-form-slot').innerHTML = '<button hx-get=&quot;/pesticide-records/new&quot; hx-target=&quot;#record-form-slot&quot; hx-swap=&quot;innerHTML&quot;>＋ 新規追加</button>'; htmx.process(this.closest('#record-form-slot'))">
{% else %}
<form hx-post="/pesticide-records/"
      hx-target="#records-table tbody" hx-swap="afterbegin"
      hx-on::after-request="this.reset()">
{% endif %}
  <label>散布日 <input name="spray_date" type="date" required value="{{ record.spray_date if record else '' }}"></label>
  <label>ほ場
    <select name="field_id" required>
      {% for f in fields %}
        <option value="{{ f.id }}" {% if record and record.field_id == f.id %}selected{% endif %}>{{ f.field_code }} {{ f.name or "" }}</option>
      {% endfor %}
    </select>
  </label>
  <label>農薬名
    <input name="pesticide_name" required list="pesticide-names"
           value="{{ record.pesticide_name if record else '' }}">
    <datalist id="pesticide-names">
      {% for n in pesticide_names %}<option value="{{ n }}"></option>{% endfor %}
    </datalist>
  </label>
  <label>希釈倍率 <input name="dilution_rate" placeholder="1000倍" value="{{ record.dilution_rate if record and record.dilution_rate else '' }}"></label>
  <label>量 <input name="spray_amount" type="number" step="0.01" value="{{ record.spray_amount if record and record.spray_amount is not none else '' }}"></label>
  <label>単位 <input name="spray_unit" placeholder="L/10a" value="{{ record.spray_unit if record and record.spray_unit else '' }}"></label>
  <label>備考 <input name="notes" value="{{ record.notes if record and record.notes else '' }}"></label>
  <button type="submit">{{ "更新" if record else "追加" }}</button>
  <button type="button"
          hx-get="/pesticide-records/" hx-target="#record-form-slot" hx-select="#record-form-slot"
          hx-swap="outerHTML">キャンセル</button>
</form>
