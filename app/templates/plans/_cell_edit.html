<td class="plan-cell editing">
  <form hx-post="/plans/{{ plan_id }}/cell" hx-target="#plan-grid" hx-swap="innerHTML">
    <input type="hidden" name="field_id" value="{{ field_id }}">
    <input type="hidden" name="year" value="{{ year }}">
    <input type="text" name="crop" value="{{ crop }}" autofocus
           list="plan-crop-sug-{{ field_id }}-{{ year }}"
           hx-get="/plans/{{ plan_id }}/cell?field_id={{ field_id }}&year={{ year }}"
           hx-trigger="keyup[key=='Escape']"
           hx-target="closest td" hx-swap="outerHTML">
    <button type="submit" class="cell-save-btn" title="固定して保存 (Enter)">📌</button>
    <button type="button" class="cell-cancel-btn" title="キャンセル (Esc)"
            hx-get="/plans/{{ plan_id }}/cell?field_id={{ field_id }}&year={{ year }}"
            hx-target="closest td" hx-swap="outerHTML">✗</button>
    <datalist id="plan-crop-sug-{{ field_id }}-{{ year }}">
      {% for c in crops %}<option value="{{ c }}"></option>{% endfor %}
    </datalist>
  </form>
</td>
