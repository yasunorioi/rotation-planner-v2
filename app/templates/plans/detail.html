{% extends "base.html" %}
{% block title %}{{ plan.name }} — 輪作計画{% endblock %}
{% block content %}
<p><a href="/plans/">← 計画一覧</a></p>
<h2>{{ plan.name }}</h2>
<p>
  対象年度: {{ plan.start_year }} 〜 {{ plan.end_year }}
  &nbsp;|&nbsp;
  <a href="/plans/{{ plan.id }}/constraints">制約設定</a>
  &nbsp;|&nbsp;
  <a href="/plans/{{ plan.id }}/result.csv">CSV</a>
  /
  <a href="/plans/{{ plan.id }}/result.pdf">PDF</a>
  &nbsp;|&nbsp;
  <a href="/plans/{{ plan.id }}/compare">計画 vs 実績</a>
</p>

<div class="snapshot-block">
  <form hx-post="/plans/{{ plan.id }}/snapshot"
        hx-target="#snapshot-result" hx-swap="innerHTML">
    <button type="submit">スナップショット保存</button>
    <small>現在の最適化結果を保存して、後から「計画 vs 実績」で比較できるようにします。</small>
  </form>
  <div id="snapshot-result"></div>
</div>

<div class="optimize-toolbar">
  <button hx-post="/plans/{{ plan.id }}/optimize"
          hx-target="#optimize-result" hx-swap="innerHTML"
          hx-indicator="#optimize-spinner">計画を生成</button>
  <span id="optimize-spinner" class="htmx-indicator">… 最適化計算中（数秒待ち）</span>
</div>

<div id="optimize-result"></div>
{% endblock %}
